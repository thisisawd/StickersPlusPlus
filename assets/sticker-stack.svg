  <!-- Second circle - teal -->
  <ellipse cx="55" cy="72" rx="35" ry="35" fill="#4ECDC4"/>
  <ellipse cx="55" cy="72" rx="35" ry="35" stroke="white" stroke-width="4"/>

  <!-- Third circle - pink/coral -->
  <ellipse cx="45" cy="65" rx="35" ry="35" fill="#F06B6B"/>
