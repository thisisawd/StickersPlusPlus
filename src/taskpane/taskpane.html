<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickers++</title>
  <!-- Office JS -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <!-- Fluent UI Icons (CDN) -->
  <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/css/fabric.min.css" />
</head>
<body>
  <div id="app">
    <!-- Main Content Area -->
    <div class="app-body">
      <!-- Sidebar: Sticker Pack Icons -->
      <nav class="sidebar" id="sidebar">
        <!-- Copilot icon is always first -->
        <button class="sidebar-icon active" id="btn-copilot" title="Create with Copilot" aria-label="Create with Copilot">
          <img class="copilot-icon" src="../assets/app-icon.png" alt="Stickers++" width="36" height="36" />
        </button>
        <!-- Dynamic sticker pack icons will be added here -->
      </nav>

      <!-- Content Panel -->
      <main class="content-panel" id="content-panel">
        <!-- Copilot Prompt View (default) -->
        <div class="view" id="view-copilot">
          <div class="copilot-prompt-container">
            <div class="copilot-header">
              <img class="copilot-logo" src="../assets/app-icon.png" alt="Stickers++" width="72" height="72" />
              <h2 class="copilot-title">Stickers++</h2>
            </div>
            <p class="copilot-description">What type of stickers would you like to create?</p>
            <div class="prompt-input-container">
              <input
                type="text"
                id="sticker-prompt"
                class="prompt-input"
                placeholder="e.g. Math manipulatives, Gold stars, Smiley faces..."
                aria-label="Describe the stickers you want to create"
              />
            </div>
            <div class="prompt-suggestions">
              <span class="suggestion-label">Try:</span>
              <button class="suggestion-chip" data-prompt="Pusheen cat stickers">🐱 Pusheen</button>
              <button class="suggestion-chip" data-prompt="Orca whale stickers">🐋 Orcas</button>
              <button class="suggestion-chip" data-prompt="Base 10 blocks">🔢 Base 10 blocks</button>
              <button class="suggestion-chip" data-prompt="2D Shapes">🔷 2D Shapes</button>
              <button class="suggestion-chip" data-prompt="3D Shapes">🧊 3D Shapes</button>
              <button class="suggestion-chip" data-prompt="Gold stars and rewards">⭐ Gold stars</button>
              <button class="suggestion-chip" data-prompt="Checkmarks and corrections">✅ Checkmarks</button>
              <button class="suggestion-chip" data-prompt="Science lab equipment">🔬 Science lab</button>
              <button class="suggestion-chip" data-prompt="Reading and books">📚 Reading</button>
            </div>
          </div>
        </div>

        <!-- Loading View -->
        <div class="view hidden" id="view-loading">
          <div class="loading-container">
            <div class="loading-spinner"></div>
            <p class="loading-text">Generating your stickers...</p>
            <p class="loading-subtext" id="loading-subtext">Creating "Math manipulatives" sticker set</p>
          </div>
        </div>

        <!-- Sticker Grid View -->
        <div class="view hidden" id="view-stickers">
          <div class="sticker-pack-header">
            <h2 class="pack-title" id="pack-title">Math manipulatives</h2>
            <div class="pack-header-actions">
              <button class="btn-delete-set" id="btn-delete" title="Delete this set" aria-label="Delete this sticker set">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M7 4V2h10v2h5v2h-2l-1 15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6H2V4h5zm2 4v10h2V8H9zm4 0v10h2V8h-2z"/></svg>
                Delete this set
              </button>
            </div>
          </div>
          <div class="sticker-grid" id="sticker-grid">
            <!-- Stickers will be dynamically populated here -->
          </div>
        </div>
      </main>
    </div>

    <!-- Footer with action buttons -->
    <footer class="app-footer" id="app-footer">
      <button class="btn-action btn-add-onenote" id="btn-add" style="display:none" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M11 5v6H5v2h6v6h2v-6h6v-2h-6V5h-2z"/></svg>
        Insert to Page
      </button>
      <button class="btn-action btn-generate" id="btn-generate">
        <svg class="sparkle-icon" width="18" height="18" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14 8.5L20 10L14 12L12 19L10 12L4 10L10 8.5L12 2Z"/>
          <path d="M18 14L19 16.5L21.5 17.5L19 18.5L18 21L17 18.5L14.5 17.5L17 16.5L18 14Z"/>
        </svg>
        <span id="btn-generate-text">Generate</span>
      </button>
    </footer>
  </div>
</body>
</html>
